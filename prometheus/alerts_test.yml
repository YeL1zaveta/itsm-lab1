rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+100x120'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x60 0+20x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KbSearchAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 65m
        alertname: KbSearchAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P1
            exp_annotations:
              summary: "kb/search availability fast burn: error budget exhausted in under 2 hours"

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+100x400'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x200 0+10x200'
    alert_rule_test:
      - eval_time: 200m
        alertname: KbSearchAvailabilitySlowBurn
        exp_alerts: []
      - eval_time: 380m
        alertname: KbSearchAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P2
            exp_annotations:
              summary: "kb/search availability slow burn: error budget draining over hours"
